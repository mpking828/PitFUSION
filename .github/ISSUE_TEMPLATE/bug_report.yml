name: Bug report
description: Create a report to help us improve
labels: ["bug"]
body:
  - type: textarea
    id: describe
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
      value: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.

  - type: dropdown
    id: hosting
    attributes:
      label: Hosting
      description: How are you running PitFusion?
      options:
        - Hosted (pitfusion.com)
        - Self-hosted
    validations:
      required: true

  - type: textarea
    id: desktop
    attributes:
      label: Desktop
      description: Please complete the following information.
      value: |
        - OS: [e.g. Windows 11]
        - Browser: [e.g. Chrome, Safari]
        - Version: [e.g. 22]

  - type: textarea
    id: smartphone
    attributes:
      label: Smartphone
      description: Please complete the following information.
      value: |
        - Device: [e.g. iPhone 15]
        - OS: [e.g. iOS 18]
        - Browser: [e.g. stock browser, Safari]
        - Version: [e.g. 22]

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
